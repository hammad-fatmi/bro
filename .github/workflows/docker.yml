name: Build Push and Deploy Docker Images

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 678878256416.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: bro
  BLUE_INSTANCE: i-04a462a6eaaec1140
  GREEN_INSTANCE: i-09b95da770390d17c

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::678878256416:role/fatmiOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:frontendi" ./frontend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:frontendi"

          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:backendi" ./backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:backendi"

          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:nginxi" ./nginx
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:nginxi"

      - name: Deploy to both EC2 instances through SSM
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -e

          test -f /opt/bro/backend.env || {
            echo "Missing /opt/bro/backend.env"
            exit 1
          }

          aws ecr get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin \
              678878256416.dkr.ecr.us-east-1.amazonaws.com

          docker pull 678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:frontendi
          docker pull 678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:backendi
          docker pull 678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:nginxi

          docker network create bro-net 2>/dev/null || true

          docker rm -f nginxc frontendc backendc 2>/dev/null || true

          docker run -d \
            --name backendc \
            --restart unless-stopped \
            --network bro-net \
            --env-file /opt/bro/backend.env \
            -p 5000:5000 \
            678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:backendi

          docker run -d \
            --name frontendc \
            --restart unless-stopped \
            --network bro-net \
            678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:frontendi

          docker run -d \
            --name nginxc \
            --restart unless-stopped \
            --network bro-net \
            -p 80:80 \
            678878256416.dkr.ecr.us-east-1.amazonaws.com/bro:nginxi

          docker ps
          SCRIPT

          SCRIPT_B64=$(base64 -w 0 deploy.sh)
          REMOTE_COMMAND="echo '$SCRIPT_B64' | base64 -d > /tmp/deploy.sh && sudo bash /tmp/deploy.sh"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$BLUE_INSTANCE" "$GREEN_INSTANCE" \
            --parameters "$(jq -nc --arg cmd "$REMOTE_COMMAND" \
              '{commands:[$cmd]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE in "$BLUE_INSTANCE" "$GREEN_INSTANCE"; do
            for ATTEMPT in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --query 'Status' \
                --output text 2>/dev/null || true)

              case "$STATUS" in
                Success)
                  echo "$INSTANCE deployment succeeded"
                  break
                  ;;
                Failed|Cancelled|TimedOut)
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE" \
                    --query 'StandardErrorContent' \
                    --output text || true
                  exit 1
                  ;;
              esac

              if [ "$ATTEMPT" -eq 60 ]; then
                echo "Timed out waiting for $INSTANCE"
                exit 1
              fi

              sleep 5
            done
          done
