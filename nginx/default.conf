upstream frontend_upstream {
    server frontend_green:3000;
    server frontend_blue:3000;
}

server {
    listen 80;
    server_name devtech2026.duckdns.org;

    client_max_body_size 50M;

    # ----------------------------
    # API (no caching)
    # ----------------------------
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Cache-Control "no-store";
    }

    # ----------------------------
    # STATIC ASSETS (cache forever safely)
    # Vite hashed files → safe to cache
    # ----------------------------
    location /assets/ {
        proxy_pass http://frontend_upstream;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ----------------------------
    # MAIN APP (NEVER CACHE THIS)
    # This is what fixes your "old UI" issue
    # ----------------------------
    location / {
        proxy_pass http://frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}