services:
  frontend_blue:
    image: ghcr.io/hammad-fatmi/bro/frontend:gh
    container_name: frontend_blue
    expose:
      - "3000"
    restart: unless-stopped

  frontend_green:
    image: ghcr.io/hammad-fatmi/bro/frontend:gh
    container_name: frontend_green
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/hammad-fatmi/bro/backend:gh
    container_name: bro-backend-1
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: bro-nginx-1
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/bro/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend_blue
      - frontend_green
      - backend
    restart: unless-stopped