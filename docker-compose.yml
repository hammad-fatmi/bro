services:
  frontend_blue:
    image: ghcr.io/hammad-fatmi/bro/frontend
    container_name: frontend_blue
    expose:
      - "3000"

  frontend_green:
    image: ghcr.io/hammad-fatmi/bro/frontend
    container_name: frontend_green
    expose:
      - "3000"

  backend:
    image: ghcr.io/hammad-fatmi/bro/backend
    expose:
      - "5000"
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/bro/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend_blue
      - frontend_green
      - backend
