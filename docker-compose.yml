services:
  frontend:
    container_name: frontendc
    image: frontendi
    build: ./frontend

  backend:
    container_name: backendc
    image: backendi
    build: ./backend
    env_file:
      - ./backend/.env

  nginx:
    container_name: nginxc
    image: nginxi
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend